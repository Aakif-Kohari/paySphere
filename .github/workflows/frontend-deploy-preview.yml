name: Frontend Deploy Preview

# Builds the frontend and deploys a temporary, isolated preview for every
# Pull Request that touches frontend/ files, then comments the live URL so
# reviewers can test the UI without pulling the branch locally.
#
# Deployment is handled by Vercel. To enable previews, configure the
# following repository secrets:
#   VERCEL_TOKEN         - Vercel access token (Account > Settings > Tokens)
#   VERCEL_ORG_ID        - Vercel team id (comma separated in .vercel/project.json)
#   VERCEL_PROJECT_ID    - Vercel project id (comma separated in .vercel/project.json)
#   VERCEL_PREVIEW_API_URL - Optional: staging backend URL the preview build
#                            should talk to. Keeps previews isolated from the
#                            production database. Leave unset to use the
#                            default VITE_API_URL fallback in src/services/api.js
#
# If the secrets are not configured the workflow still lints + builds the
# frontend as a smoke check and reports the result on the PR.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy-preview.yml'

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Frontend preview build & deploy
    runs-on: ubuntu-latest

    env:
      # `secrets` cannot be referenced from a step-level `if:`. GitHub rejects
      # the expression when it compiles the workflow ("Unrecognized named-value:
      # 'secrets'"), and a workflow that fails to compile never starts a single
      # job — which is why every run of this file, on every branch and on pushes
      # to main, has been a red cross with zero jobs since it was added.
      #
      # Job-level `env` *can* read secrets, and a step-level `if:` *can* read
      # `env`, so the check is hoisted here. Note the string comparison: an env
      # value is always a string, so this is 'true', not true.
      VERCEL_CONFIGURED: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
      # A `pull_request` run triggered from a fork gets a read-only GITHUB_TOKEN
      # no matter what the `permissions:` block above asks for, so posting a
      # comment would fail with "Resource not accessible by integration".
      CAN_COMMENT: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Deploy preview to Vercel
        id: vercel
        if: env.VERCEL_CONFIGURED == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_API_URL: ${{ secrets.VERCEL_PREVIEW_API_URL }}
        run: |
          npm install --global vercel
          cd frontend
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          vercel build --yes --token="$VERCEL_TOKEN"
          DEPLOYMENT_URL="$(vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN")"
          echo "preview_url=${DEPLOYMENT_URL}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Comment preview URL on PR
        if: env.CAN_COMMENT == 'true'
        uses: actions/github-script@v7
        env:
          # `steps` is a workflow context, not a variable in the script sandbox:
          # `steps?.vercel?.outputs?.preview_url` threw `ReferenceError: steps is
          # not defined` and took the whole step down with it. The value has to
          # be interpolated in from the workflow side.
          PREVIEW_URL: ${{ steps.vercel.outputs.preview_url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const previewUrl = process.env.PREVIEW_URL;

            let body;
            if (previewUrl) {
              body = [
                '🚀 **Frontend preview is ready!**',
                '',
                `You can test the UI changes from this PR at: ${previewUrl}`,
                '',
                '- The preview is an isolated, temporary deployment and is torn down when this PR is merged or closed.',
                '- It points at the staging API URL configured via the `VERCEL_PREVIEW_API_URL` secret so it never touches the production database.',
                '- Check status ✅ / approval results directly in the Vercel dashboard.',
              ].join('\n');
            } else {
              body = [
                '✅ **Frontend build passed** (lint + production build).',
                '',
                'Deploy previews are not enabled because the `VERCEL_TOKEN`, `VERCEL_ORG_ID` and `VERCEL_PROJECT_ID` secrets are not configured on this repository.',
                '',
                'Maintainers: add those secrets (see `.github/workflows/frontend-deploy-preview.yml`) to automatically deploy an isolated preview URL on every PR.',
              ].join('\n');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
