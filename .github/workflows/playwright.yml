name: Playwright E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
      redis:
        image: redis:7.0
        ports:
          - 6379:6379

    # Set environment variables for the test
    env:
      CI: true
      BASE_URL: http://localhost:5173
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL || 'test@example.com' }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD || 'testpassword' }}
      VITE_API_URL: http://localhost:5000
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: package-lock.json
    
    - name: Install dependencies
      run: npm ci

    - name: Run Jest unit tests with coverage
      working-directory: ./backend
      run: npm run test -- --coverage
      continue-on-error: true

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        directory: ./backend/coverage/
    
    - name: Install Playwright browsers
      working-directory: ./frontend
      run: npx playwright install --with-deps chromium
    
    - name: Seed E2E Test User
      working-directory: ./backend
      run: node src/seeds/e2eSeeder.js
      env:
        MONGO_URI: ${{ secrets.TEST_MONGO_URI || 'mongodb://127.0.0.1:27017/paySphere_test' }}
        TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL || 'test@example.com' }}
        TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD || 'testpassword' }}

    - name: Start backend server
      working-directory: ./backend
      run: |
        npm run dev &
      env:
        MONGO_URI: ${{ secrets.TEST_MONGO_URI || 'mongodb://127.0.0.1:27017/paySphere_test' }}
        JWT_SECRET: ${{ secrets.TEST_JWT_SECRET || 'test_jwt_secret_change_me' }}
        JWT_REFRESH_SECRET: ${{ secrets.TEST_JWT_REFRESH_SECRET || 'test_jwt_refresh_secret_change_me' }}
        REDIS_URI: ${{ secrets.TEST_REDIS_URI || 'redis://127.0.0.1:6379' }}
        NODE_ENV: test
    
    - name: Wait for backend to be ready
      run: |
        timeout 60 bash -c 'until curl -f http://localhost:5000/api/health; do sleep 2; done'
    
    - name: Run Playwright tests
      working-directory: ./frontend
      run: npx playwright test
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 30
    
    - name: Upload test artifacts (screenshots, videos, traces)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-artifacts
        path: |
          frontend/test-results/
        retention-days: 7
