name: PR Assigned Conflict Check

on:
  pull_request:
    types: [opened, edited]

jobs:
  check-conflict:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Check if issue is assigned to someone else
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const prBody = pr.body;
            const prAuthor = pr.user.login;
            
            if (!prBody) {
              console.log("No PR body found. Skipping.");
              return;
            }

            // Match standard GitHub closing keywords: Fixes #123, Resolves #123, etc.
            const regex = /(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#(\d+)/ig;
            const matches = [...prBody.matchAll(regex)];

            if (matches.length === 0) {
              console.log("No linked issues found in PR body. Skipping.");
              return;
            }

            const { owner, repo } = context.repo;
            const prNumber = pr.number;
            
            let shouldClose = false;

            for (const match of matches) {
              const issueNumber = parseInt(match[1], 10);
              
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: issueNumber
                });

                // Ignore if the linked "issue" is actually a pull request
                if (issue.pull_request) {
                  continue; 
                }

                // Check if issue has assignees
                if (issue.assignees && issue.assignees.length > 0) {
                  const isAssignee = issue.assignees.some(assignee => assignee.login.toLowerCase() === prAuthor.toLowerCase());
                  
                  // If the issue is assigned, but NOT to the PR author
                  if (!isAssignee) {
                    shouldClose = true;
                    console.log(`Conflict detected: Issue #${issueNumber} is assigned to someone else, but PR was opened by ${prAuthor}.`);
                    break;
                  }
                }
              } catch (error) {
                console.error(`Failed to fetch issue #${issueNumber}: ${error.message}`);
              }
            }

            if (shouldClose) {
              const commentBody = "Thank you for your interest! However, this PR is being closed because the linked issue is already assigned to somebody else. If you want to contribute, please browse our open issues and ask to be assigned to an unassigned one.";
              
              // Post comment
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: commentBody
              });

              // Close the PR
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: prNumber,
                state: 'closed'
              });
              
              console.log("PR successfully closed due to assignment conflict.");
            }
