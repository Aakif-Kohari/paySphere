name: PR Issue Link Check

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  pull-requests: write

jobs:
  check-issue-link:
    name: Enforce Issue Linking
    runs-on: ubuntu-latest

    steps:
      - name: Check PR body for issue reference
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const prBody   = context.payload.pull_request.body || '';
            const owner    = context.repo.owner;
            const repo     = context.repo.repo;

            // Matches: #123, fixes #123, closes #123, resolves #123, etc.
            const issueRefPattern =
              /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)?\s*#\d+/i;

            const hasIssueRef = issueRefPattern.test(prBody);

            if (hasIssueRef) {
              core.info(`PR #${prNumber} contains a valid issue reference. ✅`);
              return;
            }

            // Post a friendly reminder comment
            const comment = [
              '👋 Thank you for your contribution!',
              '',
              'It looks like this pull request does not reference an issue yet.',
              'Please update the PR description to mention the issue it resolves, for example:',
              '',
              '```',
              'Fixes #123',
              '```',
              '',
              'Linking your PR to an issue helps maintainers track changes and keeps the project history clean.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: comment,
            });

            // Add the label if it exists in the repo; skip gracefully if not
            try {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: prNumber,
                labels: ['needs-issue-link'],
              });
            } catch (err) {
              core.warning(`Could not add label 'needs-issue-link': ${err.message}`);
            }

            // Fail the check so the PR is visibly blocked until the link is added
            core.setFailed(
              `PR #${prNumber} must reference an issue (e.g. "Fixes #123"). ` +
              'Please update the PR description.'
            );
