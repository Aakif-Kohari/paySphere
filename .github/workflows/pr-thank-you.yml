name: Thank and Welcome PR Authors

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write
  issues: read
  contents: read

jobs:
  thank-contributor:
    name: Thank Contributor if Assigned to Linked Issue
    runs-on: ubuntu-latest

    steps:
      - name: Check assignee and post welcome comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber  = context.payload.pull_request.number;
            const prAuthor  = context.payload.pull_request.user.login;
            const prBody    = context.payload.pull_request.body || '';
            const owner     = context.repo.owner;
            const repo      = context.repo.repo;

            core.info(`PR #${prNumber} opened by @${prAuthor}`);

            // ── 1. Extract linked issue number from the PR body ─────────────
            // Matches: closes #123 / fixes #123 / resolves #123 / #123
            const issueRefRegex =
              /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)?\s*#(\d+)/gi;

            const issueNumbers = [];
            let match;
            while ((match = issueRefRegex.exec(prBody)) !== null) {
              issueNumbers.push(parseInt(match[1], 10));
            }

            if (issueNumbers.length === 0) {
              core.info('No linked issue found in the PR body — skipping thank-you comment.');
              return;
            }

            core.info(`Linked issue(s) found: ${issueNumbers.join(', ')}`);

            // ── 2. Check each linked issue for the PR author as an assignee ──
            let isAssignee = false;

            for (const issueNumber of issueNumbers) {
              let issue;
              try {
                const response = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: issueNumber,
                });
                issue = response.data;
              } catch (err) {
                core.warning(`Could not fetch issue #${issueNumber}: ${err.message}`);
                continue;
              }

              const assignees = (issue.assignees || []).map(a => a.login.toLowerCase());
              core.info(`Issue #${issueNumber} assignees: ${assignees.join(', ') || 'none'}`);

              if (assignees.includes(prAuthor.toLowerCase())) {
                isAssignee = true;
                core.info(`@${prAuthor} is an assignee of issue #${issueNumber} ✅`);
                break;
              }
            }

            if (!isAssignee) {
              core.info(`@${prAuthor} is not an assignee of any linked issue — skipping thank-you comment.`);
              return;
            }

            // ── 3. Post the welcome comment ──────────────────────────────────
            const welcomeComment = [
              `👋 Hey @${prAuthor}, thank you for your PR!`,
              '',
              'Your contribution is greatly appreciated. 🎉',
              'A maintainer will review your code shortly.',
              '',
              'While you wait, please make sure:',
              '- [ ] Your code follows the project\'s coding conventions',
              '- [ ] All existing tests pass (`npm test`)',
              '- [ ] You\'ve added tests for new functionality (if applicable)',
              '- [ ] The PR description clearly describes your changes',
              '',
              'Thanks again for contributing to **PaySphere**! 🚀',
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: welcomeComment,
            });

            core.info(`Welcome comment posted on PR #${prNumber} ✅`);

            // ── 4. Add "needs-review" label (optional, skips gracefully) ─────
            try {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: prNumber,
                labels: ['needs-review'],
              });
              core.info(`Label "needs-review" added to PR #${prNumber} ✅`);
            } catch (err) {
              core.warning(
                `Could not add label "needs-review": ${err.message}. ` +
                'Make sure the label exists in the repository.'
              );
            }
