# ============================================================================
# Prometheus scrape configuration for PaySphere
# ============================================================================
# Scrapes the backend's /metrics endpoint (exposed via prom-client, issue #765).
# Run with the prometheus and grafana services in docker-compose.yml:
#
#   docker compose up prometheus grafana
#
# Grafana: http://localhost:3000 (admin / admin)
# Prometheus: http://localhost:9090
#
# Import monitoring/grafana-dashboard.json in Grafana to see the panels.
# ============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "paysphere-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:5000"]
        labels:
          service: paysphere-backend
